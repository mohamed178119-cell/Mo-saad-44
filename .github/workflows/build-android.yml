name: Build Android APK (from ZIP)

# الاستخدام: ارفع ملف الـ zip (أي اسم) في جذر المستودع + هذا الملف في .github/workflows/
# الـ workflow بيفك الـ zip لوحده ويبني الـ APK.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::مفيش ملف zip في جذر المستودع. ارفع ملف الـ zip بجانب مجلد .github"
            exit 1
          fi
          ZIP="${zips[0]}"
          echo "فك الملف: $ZIP"
          rm -rf app_src
          mkdir app_src
          unzip -q "$ZIP" -d app_src
          PKG=$(find app_src -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -n1)
          if [ -z "$PKG" ]; then
            echo "::error::مفيش package.json جوه الـ zip"
            exit 1
          fi
          APP_DIR=$(dirname "$PKG")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "مجلد المشروع: $APP_DIR"
          ls -la "$APP_DIR"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      - name: Download translation models (bundled inside the APK)
        # لو فشل التنزيل يكمل البناء، والتطبيق ينزّل النماذج عند أول استخدام
        continue-on-error: true
        working-directory: ${{ env.APP_DIR }}
        run: npm run models

      - name: Build web app (static)
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: Install Capacitor
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-save @capacitor/cli @capacitor/core @capacitor/android

      - name: Add Android platform
        working-directory: ${{ env.APP_DIR }}
        run: npx cap add android

      - name: Sync
        working-directory: ${{ env.APP_DIR }}
        run: npx cap sync android

      - name: Fix duplicate Kotlin stdlib classes
        working-directory: ${{ env.APP_DIR }}
        run: |
          cat >> android/build.gradle << 'EOG'
          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOG

      - name: Build APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: offline-translator-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
